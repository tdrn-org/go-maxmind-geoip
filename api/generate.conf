sync_enabled: true
sync:
  url: "https://raw.githubusercontent.com/maxmind/openapi/refs/heads/main/bundled/geoip.yaml"
  file: "geoip.yaml"
oapi_enabled: true
oapi:
  spec_file: "geoip.yaml"
  opts_file: "oapi-codegen.yaml"
  code_file: "api.gen.go"
client_enabled: true
client:
  base_pkg: "github.com/tdrn-org/go-maxmind-geoip/api"
  client_type: "github.com/tdrn-org/go-maxmind-geoip/api.ClientWithResponsesInterface"
  wrapper_type: "github.com/tdrn-org/go-maxmind-geoip/maxmindgeoip.Client"
  wrapper_file: "../client.gen.go"
mock_enabled: true
mock:
  base_pkg: "github.com/tdrn-org/go-maxmind-geoip/api"
  service_type: "github.com/tdrn-org/go-maxmind-geoip/api.StrictServerInterface"
  mock_type: "github.com/tdrn-org/go-maxmind-geoip/mock.Server"
  mock_file: "../mock/mock.gen.go"